services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: djangoauth
      POSTGRES_USER: djangoauth
      POSTGRES_PASSWORD: djangoauth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djangoauth -d djangoauth"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgres://djangoauth:djangoauth@db:5432/djangoauth
      SECRET_KEY: ${SECRET_KEY:-local-development-only}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
